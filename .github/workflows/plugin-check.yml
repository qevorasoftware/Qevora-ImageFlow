name: WordPress Plugin Check
on: [pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Verify format help layout at narrow and wide widths
        run: node tests/format-layout.cjs
      - name: Extract and lint the installable plugin
        run: |
          version=$(awk '/^Stable tag:/ {print $3}' readme.txt)
          unzip -q "dist/qevora-imageflow-v${version}.zip" -d build
          find build -type f -name '*.php' -exec php -l '{}' \; > lint.txt
          cat lint.txt
          if grep -Eq 'Parse error|Errors parsing|Fatal error' lint.txt; then exit 1; fi
      - uses: wordpress/plugin-check-action@v1
        with:
          strict: 'true'
          build-dir: ./build/qevora-imageflow
      - name: Verify conversion and template trials in WordPress
        run: |
          wp-env run cli wp plugin install elementor --activate
          cp tests/workflow-smoke.php build/qevora-imageflow/tests/workflow-smoke.php
          wp-env run cli wp eval-file wp-content/plugins/qevora-imageflow/tests/workflow-smoke.php
